version: "3.9"

services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/chatkit.db}
      TORTOISE_DATABASE_URL: ${TORTOISE_DATABASE_URL:-sqlite:///app/data/chatkit.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Generate a Fernet key and set APP_ENCRYPTION_KEY}
      ADMIN_USER__username: ${ADMIN_USER__username:-admin}
      ADMIN_USER__password: ${ADMIN_USER__password:-changeme}
      ADMIN_SECRET: ${ADMIN_SECRET:-super-secret}
    ports:
      - "8000:8000"
    volumes:
      - chatkit-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  chatkit-data:
