[tool.poetry]
name = "chatkit-embed-host"
version = "0.1.0"
description = "Self-hosted ChatKit embed manager with FastAPI, FastAPI-Admin, and a static widget loader."
authors = ["ChatKit Embed Devs"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
fastapi-admin = "^1.0.4"
tortoise-orm = "^0.25.0"
asyncpg = "^0.29.0"
pydantic-settings = "^2.3.0"
cryptography = "^42.0.8"
json5 = "^0.9.25"
openai = "^1.30.5"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
